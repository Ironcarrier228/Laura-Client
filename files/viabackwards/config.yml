# ViaBackwards Configuration
# This is the main configuration file for ViaBackwards

# If true, ViaBackwards will check for updates on GitHub.
check-for-updates: true

# If enabled, 1.9+ clients will see extended world border effects on 1.8 servers.
# This is disabled by default as it may cause performance issues.
fix-1_13-face-player: false

# If enabled, 1.10+ clients will have their hand state tracked.
# This is used for blocking with shields on 1.8 servers.
shield-blocking: true

# If enabled, 1.11+ clients will have their hand state tracked.
# This is used for blocking with shields on 1.8 servers.
no-delay-shield-blocking: false

# If enabled, 1.15+ clients will see the new respawn screen on 1.14 servers.
use-1_15-instant-respawn: false

# If enabled, 1.16+ clients will see the new death screen on 1.15 servers.
# This includes the new death messages and coordinates display.
use-new-deathmessages: true

# If enabled, 1.16+ clients will see the new scoreboard team color format.
team-color-fix: true

# If enabled, 1.17+ clients will be kicked if they don't accept the server resource pack.
forced-use-1_17-resource-pack: false

# If enabled, 1.19+ clients will see the new chat types on 1.18 servers.
chat-types-1_19:
  chat.type.text: "<%s> %s"
  chat.type.announcement: "[%s] %s"
  commands.message.display.incoming: "%s whispers to you: %s"
  chat.type.team.text: "%s <%s> %s"
  chat.type.emote: "* %s %s"
